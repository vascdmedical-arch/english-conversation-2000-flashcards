<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#147a74" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="英会話2000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="日常英会話2000文を章別・B面別に練習できるフラッシュカードです。"
    />
    <title>英会話 2000 フラッシュカード</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="学習セット">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">Aa</div>
          <div>
            <p class="eyebrow">Daily English</p>
            <h1>英会話 2000</h1>
          </div>
        </div>

        <div class="chapter-tabs" role="tablist" aria-label="章">
          <button class="tab active" data-chapter="1-1000" role="tab" type="button">
            <span>1-1000</span>
            <strong>基本1000</strong>
          </button>
          <button class="tab" data-chapter="1001-2000" role="tab" type="button">
            <span>1001-2000</span>
            <strong>追加1000</strong>
          </button>
        </div>
      </section>

      <section class="workspace">
        <aside class="control-panel" aria-label="絞り込み">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="query" aria-label="検索" placeholder="検索" type="search" />
          </label>

          <div class="field-grid">
            <label>
              <span>カテゴリー</span>
              <select id="category"></select>
            </label>

            <label>
              <span>場面</span>
              <select id="scene"></select>
            </label>
          </div>

          <div class="mode-block">
            <span class="section-label">B面</span>
            <div class="segmented" role="tablist" aria-label="B面">
              <button class="active" data-back-mode="english" role="tab" type="button">英語</button>
              <button data-back-mode="japanese" role="tab" type="button">日本語</button>
              <button data-back-mode="memo" role="tab" type="button">メモ</button>
              <button data-back-mode="all" role="tab" type="button">全部</button>
            </div>
          </div>

          <div class="mode-block">
            <span class="section-label">音声</span>
            <div class="voice-note">スマホの自然な英語音声で再生します</div>
          </div>

          <div class="progress-panel">
            <div>
              <span id="phrase-count">0文</span>
              <strong id="progress-value">0%</strong>
            </div>
            <div class="progress-track" aria-hidden="true">
              <span id="progress-bar"></span>
            </div>
          </div>

          <button id="starred-filter" class="wide-action" aria-pressed="false" type="button">
            ☆ お気に入りだけ表示
          </button>
        </aside>

        <section class="study-area" aria-label="カード">
          <div class="card-toolbar">
            <div class="meta-row">
              <span id="phrase-no">No. -</span>
              <span id="phrase-level">-</span>
              <span id="phrase-politeness">-</span>
            </div>
            <div class="toolbar-actions">
              <button
                id="star-button"
                class="icon-button"
                aria-label="この文をお気に入りに追加"
                title="この文をお気に入りに追加"
                type="button"
              >
                ☆
              </button>
              <button id="shuffle-button" class="icon-button" aria-label="シャッフル" title="シャッフル" type="button">
                ↝
              </button>
              <button id="speech-button" class="icon-button primary" aria-label="発音" title="発音" type="button">
                ▶
              </button>
            </div>
          </div>

          <button
            id="flashcard"
            class="flashcard"
            aria-label="カードを反転。左右スワイプで前後へ移動"
            type="button"
          >
            <span class="card-face card-front">
              <span id="front-label" class="card-label">A面 日本語</span>
              <span id="front-text" class="prompt japanese-text">読み込み中</span>
              <span id="scene-line" class="scene-line"></span>
            </span>

            <span class="card-face card-back" aria-hidden="true">
              <span id="back-label" class="card-label">B面 英語</span>
              <span id="back-content" class="answer-stack"></span>
            </span>
          </button>

          <div class="nav-row">
            <button id="prev-button" type="button">← 前へ</button>
            <button id="flip-button" type="button">⟳ 反転</button>
            <button id="known-button" class="known" type="button">✓ 覚えた</button>
            <button id="next-button" type="button">次へ →</button>
          </div>

          <div class="phrase-strip" aria-live="polite">
            <span id="position">0 / 0</span>
            <span id="status"></span>
            <span id="chapter-title"></span>
          </div>
        </section>

        <aside class="list-panel" aria-label="フレーズ一覧">
          <div class="list-header">
            <span>一覧</span>
            <strong id="list-count">0</strong>
          </div>
          <div id="phrase-list" class="phrase-list"></div>
        </aside>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
